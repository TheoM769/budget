[project]
name = "budget"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.135.3",
    "httpx>=0.27.0",
    "plotly>=6.7.0",
    "pydantic>=2.13.0",
    "typer>=0.12.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.0.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
budget = "budget.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/budget"]
